# image will be published to ghcr.io/<user>/<name>
name: andromeda
# description will be included in the image's metadata
description: My Laptop Configuration

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/secureblue/silverblue-main-hardened
image-version: 42 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/lukenukem/asus-linux/repo/fedora-%OS_VERSION%/lukenukem-asus-linux-fedora-%OS_VERSION%.repo
    install:
      - tailscale
      - papirus-icon-theme
      - syncthing
      - sushi
      - asusctl
      - asusctl-rog-gui
      - btop
      - gnome-shell-extension-appindicator

  - type: gnome-extensions
    install:
      - Dash to Dock
      - Screen Rotate
      # - GJS OSK # Doesn't support Gnome 48 yet
      - Caffeine
      # - Forge # Doesn't support Gnome 48 yet
      - Just Perfection
      - GSConnect
      - 779 # Clipboard Indicator
      - 5263 # GTK4-DING
      - 16 # Auto Move Windows
      - 1070 # Syncthing Indicator


  - type: default-flatpaks
    notify: true
    user:
      repo-url: https://dl.flathub.org/repo/flathub.flatpakrepo
      repo-name: flathub-full
      repo-title: "Flathub (User)"
      install:
        - com.mattjakeman.ExtensionManager
        - com.github.tchx84.Flatseal
        - md.obsidian.Obsidian
        - app.zen_browser.zen
        - com.discordapp.Discord
        - org.signal.Signal
        - chat.delta.desktop
        - chat.simplex.simplex
        - im.riot.Riot
        - ch.protonmail.protonmail-bridge
        - dev.deedles.Trayscale
        - app.bluebubbles.BlueBubbles
        - com.github.johnfactotum.Foliate
        - com.github.scrivanolabs.scrivano
        - com.github.flxzt.rnote
        - com.adilhanney.saber
        - org.gnome.Podcasts
        - io.gitlab.news_flash.NewsFlash
        - org.gnome.Geary
        - io.freetubeapp.FreeTube
        - io.github.amit9838.mousam
        - io.missioncenter.MissionCenter
        - org.gnome.Connections
        - org.gnome.Boxes
        - org.onlyoffice.desktopeditors
        - com.moonlight_stream.Moonlight
        - org.localsend.localsend_app
        - org.torproject.torbrowser-launcher
        - com.bitwarden.desktop
        - com.spotify.Client
        - com.heroicgameslauncher.hgl
        - com.vysp3r.ProtonPlus
        - com.valvesoftware.Steam
        - org.gnome.Loupe
        - org.gnome.Decibels
        - org.gnome.Totem
        - org.gnome.Calendar
        - org.gnome.NetworkDisplays

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
